name: Run Gemini AI Script

# Memicu workflow ini setiap kali ada push atau pull request di branch main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengunduh kode dari repository Anda ke server GitHub Actions
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. Memasang versi Python di server
    - name: Set up Python
      uses: actions/actions-setup-python@v5
      with:
        python-node-version: '3.10'

    # 3. Menginstall library Google Gen AI yang dibutuhkan
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-generativeai

    # 4. Menjalankan script main.py sambil memasukkan API Key dari GitHub Secrets
    - name: Run main.py script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python main.py

